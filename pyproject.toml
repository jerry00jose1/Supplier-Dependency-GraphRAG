[project]
name = "supplier-dependency-graphrag"
version = "0.1.0"
description = "Supplier dependency investigation using knowledge graphs and evidence-backed retrieval; procurement foundation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jerry Jose" }]
dependencies = [
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.1",
  "langchain-core>=1.8.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "fastembed>=0.4.0",
  "slack-bolt>=1.21.0",
  "slack-sdk>=3.33.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["procurement_agent"]
